<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://use.typekit.net/hoa4qql.css">
    <title>CONVERSOR DE MOEDAS</title>
</head>

<body>

    <img class="logo-gif" src="./assets/Economia GIF by Startup Foco Econômico.gif" alt="logo main ">


    <main>
        <label for="">
            Converter <strong>de</strong>
            <select>
                <option >
                    R$ REAL BRASILEIRO
                </option>
            </select>
        </label>


        <label for="">
            Converter <strong>para</strong>
            <select class="currency-select">
                <option value="dolar">US$ DÓLAR AMERICADO </option>
                <option value="euro">€ EURO</option>
            </select>
        </label>

        <label for="">
            Valor
            <input class="input-currency" placeholder="10.000.00">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="brasil">
                <img src="./assets/brasil 2.png" alt="logo-moeda-converter">
                <p class="moeda-brasileira">Real</p>
                <p class="moeda-valor">R$ 0,00</p>
            </div>

            <img class="arrow" src="./assets/Vector.png" alt="seta">

            <div class="usa">
            <img class="img-us"  src="./assets/estados-unidos (1) 1.png" alt="logo-moeda-covertida">
                <p class="moeda-us">Dólar Americano</p>
                <p class="moeda-valor-convertida">US$ 0,00</p >
            </div>
        </section>
    </main>




</body>

<script src="./java.js"></script>
</html>
